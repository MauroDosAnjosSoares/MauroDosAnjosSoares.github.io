<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eu sou Mauros</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #101418;
        color: #f7f2e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 25% 20%, rgba(34, 197, 94, 0.22), transparent 34%),
          radial-gradient(circle at 78% 74%, rgba(56, 189, 248, 0.18), transparent 32%),
          #101418;
      }

      main {
        width: min(92vw, 900px);
        text-align: center;
        padding: 48px 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 10vw, 132px);
        line-height: 0.95;
        letter-spacing: 0;
        text-transform: lowercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>eu sou mauros</h1>
    </main>
  </body>
</html>
